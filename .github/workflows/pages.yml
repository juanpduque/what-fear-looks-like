name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/prepare-pages.sh"
      - ".github/workflows/pages.yml"
      - "pipeline/data/canonical_ids.txt"
      - "pipeline/data/excluded_*.csv"
      - "pipeline/corpus.py"
      - "pipeline/check_site_invariants.py"
      - "pipeline/sync_front_n.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check site invariants
        # Warn-only until main's site data is resynced with the corpus;
        # drop continue-on-error to make it block deploys.
        continue-on-error: true
        run: python3 pipeline/check_site_invariants.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare deploy artifact
        run: bash scripts/prepare-pages.sh
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
