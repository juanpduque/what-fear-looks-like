name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/prepare-pages.sh"
      - ".github/workflows/pages.yml"
      - "pipeline/data/canonical_ids.txt"
      - "pipeline/data/excluded_*.csv"
      - "pipeline/corpus.py"
      - "pipeline/check_site_invariants.py"
      - "pipeline/sync_front_n.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # LFS holds ~46k posters + saliency maps; pulling them cold takes ~13 min.
      # Cache .git/lfs keyed on the object list so unchanged deploys skip it,
      # and a changed list restores the previous cache and fetches only the diff.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        run: git -c lfs.concurrenttransfers=32 lfs pull
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check site invariants
        run: python3 pipeline/check_site_invariants.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare deploy artifact
        run: bash scripts/prepare-pages.sh
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
