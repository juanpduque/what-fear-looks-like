name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python — pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tooling
        run: pip install -r pipeline/requirements-dev.txt
      - name: Tests (stdlib-only, run from pipeline/)
        working-directory: pipeline
        run: python -m pytest
      - name: Lint (ruff)
        working-directory: pipeline
        run: ruff check .
      - name: Format (ruff format)
        working-directory: pipeline
        run: ruff format --check .

  site:
    name: Site — eslint + prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: ESLint
        working-directory: site
        run: npm run lint
      - name: Prettier
        working-directory: site
        run: npm run format:check

  browser:
    name: Site — browser smoke tests
    runs-on: ubuntu-latest
    steps:
      # No LFS: the tests must not depend on local poster files.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (build + preview, then essay / autopsy / studios)
        working-directory: site
        run: npx playwright test
