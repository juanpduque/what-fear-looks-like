<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080b">
<title>WFLike · Jobs Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --bg2:#101218; --panel:#14161c; --ink:#e8e4da; --dim:#9a958a;
  --line:#2a2a30; --blood:#c1121f; --amber:#e5a00d; --ok:#3d9a6a;
  --err:#d45454; --idle:#6a6570;
  --display:Anton,"Arial Narrow",Impact,sans-serif;
  --mono:"Space Mono",Menlo,monospace;
  --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  background:
    radial-gradient(ellipse 90% 70% at 15% 0%, #1a1218 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 90% 10%, #121820 0%, transparent 50%),
    linear-gradient(180deg,#0a0b10 0%,#07080b 40%,#050508 100%);
}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 64px}
header{
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;
}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);
  letter-spacing:.02em;line-height:1}
.sub{color:var(--dim);font-size:14px;font-family:var(--mono)}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--dim);background:rgba(16,18,24,.7);
}
.pill.live{border-color:rgba(61,154,106,.5);color:#8fd4ad}
.pill.stale{border-color:rgba(201,137,43,.5);color:#e0b56a}
.pill.err{border-color:rgba(212,84,84,.55);color:#f0a0a0}
.summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px;
}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{
  background:var(--panel);border:1px solid var(--line);padding:14px 14px 12px;border-radius:6px;
}
.stat .n{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:.02em}
.stat .l{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em}
.stat.running .n{color:#7eb8d8}
.stat.done .n{color:#8fd4ad}
.stat.alerts .n{color:#f0a0a0}
.stat.ec2 .n{color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:8px;min-height:148px;
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:#3a3a42;transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;line-height:1.15}
.state{
  flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--dim);
}
.state.running,.state.launched{color:#9cc8e0;border-color:rgba(58,124,165,.55);background:rgba(58,124,165,.12)}
.state.done,.state.ok{color:#8fd4ad;border-color:rgba(61,154,106,.5);background:rgba(61,154,106,.1)}
.state.failed,.state.error,.state.alert{color:#f0a0a0;border-color:rgba(212,84,84,.55);background:rgba(212,84,84,.1)}
.state.paused,.state.stopped,.state.partial,.state.warn{color:#e0b56a;border-color:rgba(201,137,43,.5);background:rgba(201,137,43,.1)}
.state.idle,.state.unknown,.state.missing{color:var(--idle)}
.bar{height:6px;background:#1c1e26;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blood),var(--amber));
  transition:width .4s ease}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);display:grid;gap:3px}
.meta b{color:var(--ink);font-weight:400}
.detail{font-size:13px;color:var(--dim);line-height:1.4;word-break:break-word}
.section{margin-top:28px}
.section h3{font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:10px;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.events{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;
  max-height:280px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--dim);
  white-space:pre-wrap;
}
.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:10px 18px}
.foot a{color:var(--amber);text-decoration:none}
.foot a:hover{text-decoration:underline}
.errbox{
  display:none;margin-bottom:14px;padding:12px 14px;border:1px solid rgba(212,84,84,.45);
  background:rgba(212,84,84,.08);border-radius:6px;font-size:14px;color:#f0c0c0;
}
.errbox.show{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar button,.toolbar select{
  background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  padding:7px 11px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;
}
.toolbar button:hover{border-color:#4a4a52}
.toolbar .hint{font-size:12px;color:var(--dim);font-family:var(--mono)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s ease infinite}
.dot.off{background:var(--err);animation:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Jobs Dashboard</h1>
      <div class="sub">What Fear Looks Like · pipeline status</div>
    </div>
    <div style="margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <span class="pill" id="livePill"><span class="dot off" id="liveDot"></span> <span id="liveLabel">cargando</span></span>
      <span class="sub" id="updatedAt">—</span>
    </div>
  </header>

  <div class="errbox" id="errBox"></div>

  <div class="toolbar">
    <button type="button" id="btnRefresh">Actualizar</button>
    <select id="intervalSel" aria-label="Intervalo de refresco">
      <option value="30">cada 30s</option>
      <option value="45" selected>cada 45s</option>
      <option value="60">cada 60s</option>
    </select>
    <span class="hint" id="srcHint">fuente: —</span>
  </div>

  <div class="summary" id="summary">
    <div class="stat running"><div class="n" id="nRun">—</div><div class="l">running</div></div>
    <div class="stat done"><div class="n" id="nDone">—</div><div class="l">done</div></div>
    <div class="stat alerts"><div class="n" id="nAlert">—</div><div class="l">alerts</div></div>
    <div class="stat ec2"><div class="n" id="nEc2">—</div><div class="l">ec2 running</div></div>
  </div>

  <div class="grid" id="jobs"></div>

  <section class="section">
    <h3>EC2 · wflike-*</h3>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>Name</th><th>State</th><th>Type</th><th>IP</th><th>Profile</th><th>Id</th></tr>
        </thead>
        <tbody id="ec2Body"><tr><td colspan="6">—</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="section">
    <h3>Eventos recientes</h3>
    <div class="events" id="events">Sin eventos aún.</div>
  </section>

  <footer class="foot">
    <span>Auto-refresh; datos live desde S3 público.</span>
    <a href="../index.html">← essay</a>
    <a href="https://github.com/juanpduque/what-fear-looks-like" target="_blank" rel="noopener">repo</a>
    <span id="pollMeta"></span>
  </footer>
</div>

<script>
(function () {
  const PUBLIC_STATUS =
    "https://amaleli-website.s3.amazonaws.com/wflike-jobs-dashboard/status.json";
  const PUBLIC_EVENTS =
    "https://amaleli-website.s3.amazonaws.com/wflike-jobs-dashboard/events.log";

  const DEFAULT_STATUS_URLS = [
    PUBLIC_STATUS,
    "./status.json",
  ];
  const DEFAULT_EVENTS_URLS = [
    PUBLIC_EVENTS,
    "./events.log",
  ];

  const params = new URLSearchParams(location.search);
  const stored = localStorage.getItem("WFLIKE_STATUS_URL") || "";
  const override = (params.get("src") || stored || "").trim();

  let refreshMs = 45000;
  let timer = null;
  let lastSrc = "";

  const $ = (id) => document.getElementById(id);

  function fmtPct(v) {
    if (v == null || Number.isNaN(Number(v))) return null;
    return Number(v).toFixed(1) + "%";
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function statusCandidates() {
    if (!override) return DEFAULT_STATUS_URLS.slice();
    if (/status\.json/i.test(override)) {
      return [override, ...DEFAULT_STATUS_URLS.filter((u) => u !== override)];
    }
    const base = override.replace(/\/?$/, "/");
    return [base + "status.json", override, ...DEFAULT_STATUS_URLS];
  }

  async function fetchFirst(urls) {
    let lastErr = null;
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: "no-store", mode: "cors" });
        if (!r.ok) {
          lastErr = new Error(url + " → HTTP " + r.status);
          continue;
        }
        const text = await r.text();
        return { data: JSON.parse(text), url };
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("no status source reachable");
  }

  async function fetchEvents(statusUrl) {
    const derived = [];
    if (statusUrl) {
      derived.push(statusUrl.replace(/status\.json(\?.*)?$/i, "events.log"));
    }
    if (override && !/status\.json/i.test(override)) {
      derived.push(override.replace(/\/?$/, "/") + "events.log");
    }
    const urls = [...derived, ...DEFAULT_EVENTS_URLS];
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: "no-store", mode: "cors" });
        if (!r.ok) continue;
        const text = await r.text();
        return text.trim().split("\n").filter(Boolean).slice(-40).join("\n");
      } catch (_) {}
    }
    return null;
  }

  function renderJobs(jobs) {
    const order = [
      "community_72k", "owlv2_backfill", "imdb_posters", "imdb_features",
      "rekognition_local", "medium_siglip_compare", "overlap_guard",
    ];
    const ids = Object.keys(jobs || {});
    ids.sort((a, b) => {
      const ia = order.indexOf(a); const ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    $("jobs").innerHTML = ids.map((id) => {
      const j = jobs[id] || {};
      const pct = j.progress_pct;
      const width = pct == null ? 0 : Math.max(0, Math.min(100, Number(pct)));
      const state = String(j.state || "unknown").toLowerCase();
      const bits = [];
      if (j.ok != null) bits.push("ok=<b>" + esc(j.ok) + "</b>");
      if (j.err != null) bits.push("err=<b>" + esc(j.err) + "</b>");
      if (j.todo != null) bits.push("todo=<b>" + esc(j.todo) + "</b>");
      if (j.eta) bits.push("eta=<b>" + esc(j.eta) + "</b>");
      if (fmtPct(pct)) bits.push("prog=<b>" + esc(fmtPct(pct)) + "</b>");
      return (
        '<article class="card">' +
          '<div class="card-top">' +
            "<h2>" + esc(j.label || id) + "</h2>" +
            '<span class="state ' + esc(state) + '">' + esc(state) + "</span>" +
          "</div>" +
          (j.phase ? '<div class="meta">phase <b>' + esc(j.phase) + "</b></div>" : "") +
          '<div class="bar" aria-hidden="true"><i style="width:' + width + '%"></i></div>' +
          (bits.length ? '<div class="meta">' + bits.join(" · ") + "</div>" : "") +
          '<div class="detail">' + esc(j.detail || j.error || "—") + "</div>" +
        "</article>"
      );
    }).join("") || "<p class='detail'>Sin jobs en status.json</p>";
  }

  function renderEc2(rows) {
    const list = rows || [];
    if (!list.length) {
      $("ec2Body").innerHTML = '<tr><td colspan="6">Ninguna instancia wflike-* visible</td></tr>';
      return;
    }
    $("ec2Body").innerHTML = list.map((i) => (
      "<tr>" +
        "<td>" + esc(i.name || "—") + "</td>" +
        "<td>" + esc(i.state || "—") + "</td>" +
        "<td>" + esc(i.type || "—") + "</td>" +
        "<td>" + esc(i.ip || "—") + "</td>" +
        "<td>" + esc(i.profile || "—") + "</td>" +
        "<td>" + esc(i.instance_id || i.error || "—") + "</td>" +
      "</tr>"
    )).join("");
  }

  function ageLabel(iso) {
    if (!iso) return "";
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return "";
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 90) return s + "s";
    if (s < 3600) return Math.round(s / 60) + "m";
    return (s / 3600).toFixed(1) + "h";
  }

  async function tick() {
    try {
      const { data, url } = await fetchFirst(statusCandidates());
      lastSrc = url;
      $("errBox").classList.remove("show");
      $("srcHint").textContent = "fuente: " + url;
      const sum = data.summary || {};
      $("nRun").textContent = sum.running ?? "—";
      $("nDone").textContent = sum.done ?? "—";
      $("nAlert").textContent = sum.alerts ?? "—";
      $("nEc2").textContent = sum.ec2_running ?? "—";
      $("updatedAt").textContent = "updated " + (data.updated_at || "—") +
        (data.updated_at ? " (" + ageLabel(data.updated_at) + ")" : "");
      $("pollMeta").textContent =
        "poll=" + (data.poll_interval_s ?? "?") + "s · took " + (data.poll_duration_s ?? "?") + "s" +
        (data.remote_sync ? " · s3=" + (data.remote_sync.ok ? "ok" : "fail") : "");
      renderJobs(data.jobs);
      renderEc2(data.ec2);

      const age = data.updated_at ? (Date.now() - Date.parse(data.updated_at)) / 1000 : 9999;
      const live = Number.isFinite(age) && age < 180;
      $("liveDot").className = "dot" + (live ? "" : " off");
      $("livePill").className = "pill " + (live ? "live" : "stale");
      $("liveLabel").textContent = live ? "live" : "stale";

      const ev = await fetchEvents(url);
      if (ev) $("events").textContent = ev;
      else if (data.events_tail) $("events").textContent = data.events_tail;
    } catch (e) {
      $("errBox").textContent =
        "No se pudo cargar status.json. Arranca el poller (bash pipeline/aws/start_jobs_dashboard.sh) o usa ?src=<url>. " +
        String(e && e.message ? e.message : e);
      $("errBox").classList.add("show");
      $("liveDot").className = "dot off";
      $("livePill").className = "pill err";
      $("liveLabel").textContent = "error";
      $("srcHint").textContent = "fuente: (fallo) " + (lastSrc || "—");
    }
  }

  function schedule() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, refreshMs);
  }

  $("btnRefresh").addEventListener("click", () => tick());
  $("intervalSel").addEventListener("change", (e) => {
    refreshMs = Math.max(15000, Number(e.target.value) * 1000);
    schedule();
    tick();
  });

  if (params.get("src")) {
    localStorage.setItem("WFLIKE_STATUS_URL", params.get("src"));
  }

  tick();
  schedule();
})();
</script>
</body>
</html>
